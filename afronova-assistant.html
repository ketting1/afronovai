<!DOCTYPE html>
<html>

<head>
    <title>AfroNova AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="ai-tools.html">AI Tools</a>
    <a href="learning.html">Learning</a>
    <a href="marketplace.html">Marketplace</a>
    <a href="afronova-ai.html">AfroNova AI</a>
    <a href="contact.html">Contact</a>
</nav>

<section class="hero">

    <h2>🤖 AfroNova AI</h2>

    <h1>Your African AI Assistant</h1>

    <p>
        Ask about AI, business, learning,
        technology, Africa, entrepreneurship,
        and digital opportunities.
    </p>

    <input
        type="text"
        id="userQuestion"
        placeholder="Ask AfroNova AI..."
    >

    <br>

    <button onclick="askAI()">
        Ask AfroNova AI
    </button>

    <div class="card" id="responseBox"
         style="margin-top:30px; max-width:800px;">
        AfroNova AI is ready.
    </div>

</section>

<script>

function askAI(){

    let question =
    document.getElementById("userQuestion")
    .value.toLowerCase();

    let response =
    document.getElementById("responseBox");

    if(question === ""){

        response.innerHTML =
        "Please enter a question.";

    }

    else if(question.includes("what is ai")){

        response.innerHTML =
        "AI stands for Artificial Intelligence. It allows computers to learn, solve problems, and assist humans.";

    }

    else if(question.includes("business")){

        response.innerHTML =
        "Business idea: Start affiliate marketing, freelancing, digital products, or content creation.";

    }

    else if(question.includes("africa")){

        response.innerHTML =
        "Africa is one of the fastest-growing regions for technology, entrepreneurship, and innovation.";

    }

    else if(question.includes("learn")){

        response.innerHTML =
        "Learning tip: Focus on one skill at a time and practice daily.";

    }

    else{

        response.innerHTML =
        "AfroNova AI is still learning. Try asking about AI, business, learning, or Africa.";

    }

}

</script>

</body>

</html>
