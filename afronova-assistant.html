<!DOCTYPE html>
<html>

<head>
    <title>AfroNova AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="ai-tools.html">AI Tools</a>
    <a href="learning.html">Learning</a>
    <a href="marketplace.html">Marketplace</a>
    <a href="afronova-assistant.html">AfroNova AI</a>
    <a href="contact.html">Contact</a>
</nav>

<section class="hero">

    <h2>🤖 AfroNova AI</h2>

    <h1>Your African AI Assistant</h1>

    <p>
        Ask about AI, business, learning,
        technology, Africa, entrepreneurship,
        and digital opportunities.
    </p>

    <input
        type="text"
        id="userQuestion"
        placeholder="Ask AfroNova AI..."
    >

    <br>

    <button onclick="askAI()">
        Ask AfroNova AI
    </button>

    <div class="card" id="responseBox"
         style="margin-top:30px; max-width:800px;">
        AfroNova AI is ready.
    </div>

</section>
<script >
function askAI(){

    let question =
    document.getElementById("userQuestion")
    .value.toLowerCase();

    let response =
    document.getElementById("responseBox");

    if(question === ""){

        response.innerHTML =
        "Please enter a question.";

    }

    else if(question.includes("what is ai")){

        response.innerHTML =
        "AI stands for Artificial Intelligence. It helps computers learn, solve problems, and assist humans.";

    }

    else if(question.includes("business")){

        response.innerHTML =
        "Business idea: Affiliate marketing, freelancing, content creation, AI services, and digital products.";

    }

    else if(question.includes("africa")){

        response.innerHTML =
        "Africa is becoming a major hub for technology, innovation, entrepreneurship, and digital growth.";

    }

    else if(question.includes("money")){

        response.innerHTML =
        "You can make money online through freelancing, affiliate marketing, content creation, and selling digital products.";

    }

    else if(question.includes("youtube")){

        response.innerHTML =
        "YouTube growth comes from consistent content, attractive thumbnails, strong titles, and audience engagement.";

    }

    else if(question.includes("tiktok")){

        response.innerHTML =
        "TikTok rewards short engaging videos with strong hooks in the first few seconds.";

    }

    else if(question.includes("learn")){

        response.innerHTML =
        "Focus on one skill at a time and practice every day. Small progress becomes big results.";

    }

    else{

        response.innerHTML =
        "AfroNova AI is still learning. Ask me about AI, business, money, Africa, YouTube, TikTok, or learning.";
        else if(question.includes("website")){

    response.innerHTML =
    "A good website should be fast, mobile-friendly, easy to navigate, and provide value to visitors.";

}

else if(question.includes("affiliate")){

    response.innerHTML =
    "Affiliate marketing works by recommending products and earning a commission when people buy through your link.";

}

else if(question.includes("freelance")){

    response.innerHTML =
    "Freelancing lets you offer skills such as writing, design, coding, or AI services to clients online.";

}

else if(question.includes("chatgpt")){

    response.innerHTML =
    "ChatGPT is an AI assistant that can help with learning, coding, writing, business ideas, and more.";

}

else if(question.includes("hello")){

    response.innerHTML =
    "Hello! I am AfroNova AI. How can I help you today?";

}
    }

}
</script >
</body>

</html>
