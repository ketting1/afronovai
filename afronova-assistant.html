<!DOCTYPE html>
<html>

<head>
    <title>AfroNova AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="ai-tools.html">AI Tools</a>
    <a href="learning.html">Learning</a>
    <a href="marketplace.html">Marketplace</a>
    <a href="afronova-assistant.html">AfroNova AI</a>
    <a href="contact.html">Contact</a>
</nav>

<section class="hero">

    <h2>🤖 AfroNova AI</h2>

    <h1>Your African AI Assistant</h1>

    <p>
        Ask about AI, business, learning,
        technology, Africa, entrepreneurship,
        and digital opportunities.
    </p>

    <input
    type="text"
    id="userQuestion"
    placeholder="Ask AfroNova AI..."
    onkeypress="if(event.key==='Enter') askAI()"
>

    <br>

    <button onclick="askAI()">
        Ask AfroNova AI
    </button>
    <div class="card"
     id="responseBox"
     style="
     margin-top:30px;
     max-width:800px;
     height:400px;
     overflow-y:auto;
     text-align:left;">
    
     
    <p><b>AfroNova AI:</b> Hello! Ask me a question.</p>
</div>

</section>
<script>

function askAI(){

    let question =
    document.getElementById("userQuestion")
    .value;

    let responseBox =
    document.getElementById("responseBox");

    let answer = "";

    if(question.toLowerCase().includes("what is ai")){

        answer =
        "AI stands for Artificial Intelligence. It helps computers learn and solve problems.";

    }

    else if(question.toLowerCase().includes("business")){

        answer =
        "Business idea: Affiliate marketing, freelancing, content creation, AI services, and digital products.";

    }

    else if(question.toLowerCase().includes("africa")){

        answer =
        "Africa is becoming a major hub for technology, innovation, and entrepreneurship.";

    }

    else{

        answer =
        "AfroNova AI is still learning. Try asking about AI, business, or Africa.";

    }

    responseBox.innerHTML +=

'<div class="chat-user">' +
'👤 You: ' + question +
'</div>' +

'<div class="chat-ai">' +
'🤖 AfroNova AI: ' + answer +
'</div>';
responseBox.scrollTop =
responseBox.scrollHeight;
    document.getElementById("userQuestion").value="";

}

</script>
</body>

</html>
